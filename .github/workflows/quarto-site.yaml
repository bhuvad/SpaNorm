# Builds and deploys the combined SpaNorm (R) / spanormpy (Python) website to GitHub Pages.
# The site exists ONLY through this workflow: nothing generated is committed (reference pages,
# rendered output and caches are git-ignored). Every code chunk executes here (CPU torch), so a
# full run takes about 20 minutes. Pull requests touching the site render only (no deploy).
#
# ORDERING: this workflow checks out BhuvaLab/spanormpy at ref main (for docs/r-to-python.md,
# docs/r-discrepancies.md and the package itself), so spanormpy must be merged to main before
# this workflow lands on SpaNorm master.
#
# Quarto: the runner's preinstalled copy is used when present (the setup action is skipped,
# since apt refuses to downgrade); a later step fails if it is older than 1.8.
#
# Python/R interop: reticulate uses the interpreter from actions/setup-python
# (RETICULATE_PYTHON). zellkonverter's basilisk does NOT use it: it builds its own conda env
# (~/.cache/R/basilisk, created on first use and deliberately NOT cached: a restored venv has
# symlinks to interpreters outside the cached path and fails with "python ... does not exist").
# Neither involves the libexpat clash that needs an
# LD_PRELOAD workaround on some local clusters.
name: quarto-site

on:
  push:
    branches: [master]
  pull_request:
    paths: ['site/**', '.github/workflows/quarto-site.yaml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-site
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_BIOC_VERSION: '3.24'
      SPANORMPY_DIR: ${{ github.workspace }}/spanormpy
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      # SpaNorm is a Bioconductor package, so the site builds on the latest R release. master
      # carries the devel version (1.7.x, odd minor), which belongs to Bioconductor devel
      # (3.24, also on R 4.6; Bioc 3.23 release ships SpaNorm 1.6.0). pak resolves Bioc
      # packages from R_BIOC_VERSION below. Bump it to the next devel (or drop it once
      # master tracks the release) when Bioconductor moves.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # SpaNorm's hard dependencies plus what the site pages and scripts load: reticulate
      # (Python chunks), zellkonverter (h5ad export), scater/patchwork (get-started),
      # knitr/rmarkdown (rendering). The HDF5Array and Seurat sections are eval: false.
      # local::. installs SpaNorm from this checkout. (spanormpy is checked out afterwards so
      # that it is not part of the R package being installed.)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::reticulate
            any::knitr
            any::rmarkdown
            any::patchwork
            any::remotes
            bioc::zellkonverter
            bioc::scater
            local::.

      - uses: actions/checkout@v4
        with:
          repository: BhuvaLab/spanormpy
          ref: main
          path: spanormpy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            spanormpy/pyproject.toml
            site/requirements.txt

      - name: Install Python packages (CPU torch first, so CUDA wheels are not pulled in)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "./spanormpy[dev]"
          pip install -r site/requirements.txt
          echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - name: Show the Python reticulate binds to
        run: |
          Rscript -e 'print(packageVersion("reticulate")); print(reticulate::py_config())'
          python -c "import readline" || echo "readline not importable (informational only)"

      # The runner image may already ship Quarto (newer than any pin; apt refuses to downgrade),
      # so install only when it is absent, then require >= 1.8.
      - name: Check for Quarto
        id: quarto-check
        run: |
          if command -v quarto >/dev/null; then echo "have=true" >> "$GITHUB_OUTPUT"; quarto --version; else echo "have=false" >> "$GITHUB_OUTPUT"; fi

      - uses: quarto-dev/quarto-actions/setup@v2
        if: steps.quarto-check.outputs.have != 'true'

      - name: Require Quarto >= 1.8
        run: |
          v=$(quarto --version)
          echo "quarto $v"
          IFS=. read -r maj min _ <<< "$v"
          if [ "$maj" -lt 1 ] || { [ "$maj" -eq 1 ] && [ "$min" -lt 8 ]; }; then echo "Quarto $v is older than 1.8"; exit 1; fi

      # altdoc is installed at a fixed version into site/_rlib by build_reference.sh
      - name: Cache altdoc
        uses: actions/cache@v4
        with:
          path: site/_rlib
          key: altdoc-0.7.3-${{ runner.os }}-${{ hashFiles('site/scripts/build_reference.sh') }}

      - name: Build reference pages
        run: bash site/scripts/build_reference.sh

      - name: Render site
        run: quarto render site

      - name: Check links
        run: python site/scripts/check_links.py

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: site
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
